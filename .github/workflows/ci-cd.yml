name: FundChain CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run type-check

  build:
    name: Production Next.js Build
    needs: validate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ukpvvhiowiexswzlmepr.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder' }}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID || 'c303107085cb2bbcd1d184ebaa964f7a' }}
      NEXT_PUBLIC_FLEXIBLE_POOL_ADDRESS: '0x54A39697E45a7dC7d6DC7e43B3cDAF8Cd71cBC43'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-artifact
          path: .next
          retention-days: 7

  contracts-audit:
    name: Smart Contract Artifacts & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Contract Addresses & ABIs
        run: |
          node -e "
            const fs = require('fs');
            const abi = fs.readFileSync('./src/lib/contracts/flexibleAbi.ts', 'utf8');
            const chains = fs.readFileSync('./src/lib/contracts/chains.ts', 'utf8');
            if (!abi.includes('FLEXIBLE_POOL_ABI') || !chains.includes('CONTRACT_ADDRESSES')) {
              throw new Error('Contract definitions missing');
            }
            console.log('Contract configuration verified successfully.');
          "
